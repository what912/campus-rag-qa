name: Functional checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_checks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/app.js && node --check static/chat-history.js && node --check static/review.js
